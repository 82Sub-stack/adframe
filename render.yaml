services:
  - type: web
    name: adframe
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && npm exec --prefix server -- puppeteer browsers install chrome
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      - key: NODE_ENV
        value: production
      - key: MOCKUP_CONCURRENCY
        value: "1"
      - key: MOCKUP_JOB_TIMEOUT_MS
        value: "70000"
      - key: CURATED_SLOT_PROBE_CONCURRENCY
        value: "1"
      - key: CAPTURE_MAX_SCROLL_PX
        value: "1600"
      - key: CAPTURE_MAX_HEIGHT
        value: "3400"
      - key: SLOT_SCAN_LIMIT
        value: "900"
      - key: CAPTURE_VIEWPORT_WIDTH
        value: "1366"
      - key: ADTAG_NAV_TIMEOUT_MS
        value: "10000"
      - key: ADTAG_WAIT_MS
        value: "1500"
      - key: BROWSER_RECYCLE_EVERY
        value: "1"
      - key: SUGGESTION_PREFLIGHT_TIMEOUT_MS
        value: "4500"
      - key: SUGGESTION_PREFLIGHT_CONCURRENCY
        value: "4"
      - key: PUPPETEER_SINGLE_PROCESS
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
